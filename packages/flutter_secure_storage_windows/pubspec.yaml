name: flutter_secure_storage_windows
description: Windows Credential Manager implementation for flutter_secure_storage.
version: 4.2.2
publish_to: none
environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"
dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.1
  win32: ^6.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      windows:
        dartPluginClass: FlutterSecureStorageWindows
